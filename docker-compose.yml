# Chạy: docker compose up -d --build   -> mở http://localhost:${WEB_PORT:-8088}
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-12345678}
      MYSQL_DATABASE: calishealth
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
    # Chỉ mở cho máy host (debug bằng MySQL client), không public ra ngoài
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-12345678}"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:mysql://mysql:3306/calishealth?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-12345678}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8088}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      EXERCISE_VIDEO_DIR: /data/uploads/exercise-videos
      EXERCISE_ANATOMY_DIR: /data/uploads/exercise-anatomy
      PROFILE_AVATAR_DIR: /data/uploads/profile-avatars
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - server

volumes:
  mysql_data:
  uploads:
